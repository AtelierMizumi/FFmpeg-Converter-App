# Gradle Memory Settings
# Reduced from 8GB heap + 4GB metaspace to more reasonable defaults
# Most Flutter projects build fine with 2GB heap
# Increase these only if you encounter OutOfMemoryError during build
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

