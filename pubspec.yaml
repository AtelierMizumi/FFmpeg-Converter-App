name: ffmpeg_converter_app
description: "A cross-platform FFmpeg video converter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  desktop_drop: ^0.7.0
  file_picker: ^10.3.10
  ffmpeg_wasm: ^1.0.3
  path_provider: ^2.1.5
  cross_file: ^0.3.5+2
  gap: ^3.0.1
  url_launcher: ^6.3.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  open_file: ^3.5.11
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  
  # FFmpeg for mobile platforms (Android, iOS, macOS)
  # Using maintained fork with updated Flutter 3+ bindings
  ffmpeg_kit_flutter_new: ^4.1.0
  
  # Analytics dependencies
  device_info_plus: ^12.3.0
  http: ^1.2.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  connectivity_plus: ^7.0.0
  crypto: ^3.0.3
  package_info_plus: ^9.0.0
  flutter_dotenv: ^6.0.0
  permission_handler: ^12.0.1
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Dependency overrides to avoid native assets issues on Windows
# path_provider_foundation 2.6.0+ brings in objective_c which has issues
# with Windows paths containing spaces
dependency_overrides:
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/bin/linux/
    - assets/bin/windows/
