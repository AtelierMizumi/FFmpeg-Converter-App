name: Build and Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv patchelf

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=ANALYTICS_API_KEY=${{ secrets.ANALYTICS_API_KEY }} --dart-define=ANALYTICS_WORKER_URL=${{ vars.ANALYTICS_WORKER_URL || 'https://ffmpeg-analytics-worker.thuanc177.workers.dev' }}

      - name: Create portable Linux package
        run: |
          cd build/linux/x64/release/bundle
          
          # Create a launch script
          cat > ffmpeg-converter << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          cd "$SCRIPT_DIR"
          export LD_LIBRARY_PATH="$SCRIPT_DIR/lib:$LD_LIBRARY_PATH"
          exec "$SCRIPT_DIR/flutter_test_application" "$@"
          EOF
          
          chmod +x ffmpeg-converter
          
          cd ..
          tar -czf ../../../../FFmpeg-Converter-Linux-x86_64-Portable.tar.gz -C bundle .
          
      - name: Create README for Linux
        run: |
          cat > LINUX_README.txt << 'EOF'
          FFmpeg Converter - Linux Portable Version
          ==========================================
          
          Installation:
          1. Extract the tar.gz file: tar -xzf FFmpeg-Converter-Linux-x86_64-Portable.tar.gz
          2. Run: ./ffmpeg-converter
          
          Or double-click 'ffmpeg-converter' in your file manager.
          
          Requirements:
          - GTK3
          - libmpv
          
          Install on Ubuntu/Debian: sudo apt-get install libgtk-3-0 libmpv1
          Install on Fedora: sudo dnf install gtk3 mpv-libs
          Install on Arch: sudo pacman -S gtk3 mpv
          EOF

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            FFmpeg-Converter-Linux-x86_64-Portable.tar.gz
            LINUX_README.txt

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=ANALYTICS_API_KEY=${{ secrets.ANALYTICS_API_KEY }} --dart-define=ANALYTICS_WORKER_URL=${{ vars.ANALYTICS_WORKER_URL || 'https://ffmpeg-analytics-worker.thuanc177.workers.dev' }}

      - name: Rename executable for clarity
        run: |
          cd build\windows\x64\runner\Release
          
          # Rename the main executable to a user-friendly name
          if (Test-Path "flutter_test_application.exe") {
            Rename-Item -Path "flutter_test_application.exe" -NewName "FFmpeg-Converter.exe"
            Write-Host "✅ Renamed to FFmpeg-Converter.exe"
          }
          
          # Create README
          $readme = @'
          ╔══════════════════════════════════════════════╗
          ║   FFmpeg Converter - Windows Portable       ║
          ╚══════════════════════════════════════════════╝

          🚀 CÁCH CHẠY:
          
          Double-click vào: FFmpeg-Converter.exe
          
          Đơn giản vậy thôi!

          ─────────────────────────────────────────────

          📌 TẠO SHORTCUT:
          
          1. Chuột phải vào FFmpeg-Converter.exe
          2. Chọn "Send to" → "Desktop (create shortcut)"
          3. Giờ bạn có thể chạy từ Desktop!

          ─────────────────────────────────────────────

          ℹ️  LƯU Ý:
          
          - Giữ tất cả files trong cùng thư mục này
          - Không xóa các file .dll và thư mục data/
          - Có thể copy toàn bộ thư mục sang máy khác

          ─────────────────────────────────────────────

          📦 Portable Version - No Installation Required
          '@
          
          Set-Content -Path "README.txt" -Value $readme -Encoding UTF8
          
          Write-Host "✅ Created README.txt"
        shell: pwsh

      - name: Compress Windows Build
        run: |
          # Compress from inside the Release folder so files are at root when extracted
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath FFmpeg-Converter-Windows-Portable.zip -Force
          Write-Host "✅ Created portable ZIP package"
        shell: pwsh

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: FFmpeg-Converter-Windows-Portable.zip

  build-web:
    name: Build Web & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /FFmpeg-Converter-App/ --dart-define=ANALYTICS_API_KEY=${{ secrets.ANALYTICS_API_KEY }} --dart-define=ANALYTICS_WORKER_URL=${{ vars.ANALYTICS_WORKER_URL || 'https://ffmpeg-analytics-worker.thuanc177.workers.dev' }}

      - name: Fix Source Map 404 Errors
        run: |
          # Create empty source map files to prevent 404 errors in browser console
          echo '{"version":3, "file": "flutter.js", "sources": [], "names": [], "mappings": ""}' > build/web/flutter.js.map
          echo '{"version":3, "file": "flutter_bootstrap.js", "sources": [], "names": [], "mappings": ""}' > build/web/flutter_bootstrap.js.map
          echo "✅ Created dummy source maps"

      - name: Create .nojekyll
        run: touch build/web/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=ANALYTICS_API_KEY=${{ secrets.ANALYTICS_API_KEY }} --dart-define=ANALYTICS_WORKER_URL=${{ vars.ANALYTICS_WORKER_URL || 'https://ffmpeg-analytics-worker.thuanc177.workers.dev' }}
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/app-release.apk

  create-release:
    name: Create Release
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build
      
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-build

      - name: Rename APK for clarity
        run: mv app-release.apk FFmpeg-Converter-Android.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## 🎬 FFmpeg Converter v1.0.${{ github.run_number }}
            
            **Tải về và chạy ngay - Không cần cài đặt!**
            
            ### 📥 Tải về cho hệ điều hành của bạn:
            
            | Platform | File | Kích thước | Cách dùng |
            |----------|------|------------|-----------|
            | 🪟 **Windows** | `FFmpeg-Converter-Windows-Portable.zip` | ~150MB | Giải nén → Chạy **FFmpeg-Converter.exe** |
            | 🐧 **Linux** | `FFmpeg-Converter-Linux-x86_64-Portable.tar.gz` | ~200MB | Giải nén → Chạy `./ffmpeg-converter` |
            | 🤖 **Android** | `FFmpeg-Converter-Android.apk` | ~150MB | Cài đặt APK |
            
            ---
            
            ### 🪟 Windows - Siêu đơn giản!
            
            **Bước 1:** Tải file `FFmpeg-Converter-Windows-Portable.zip`
            
            **Bước 2:** Giải nén (chuột phải → Extract All)
            
            **Bước 3:** Mở thư mục vừa giải nén, bạn sẽ thấy:
            ```
            📁 FFmpeg-Converter/
            ├── 📄 FFmpeg-Converter.exe  ← Double-click vào đây!
            ├── 📄 README.txt
            ├── 📄 các file .dll
            └── 📁 data/
            ```
            
            **Bước 4:** Double-click vào `FFmpeg-Converter.exe` → Xong!
            
            💡 **Tạo shortcut Desktop:**
            - Chuột phải vào `FFmpeg-Converter.exe`
            - Chọn `Send to` → `Desktop (create shortcut)`
            - Giờ chạy từ Desktop luôn!
            
            ---
            
            ### 🐧 Linux - Dễ dàng không kém!
            
            ```bash
            # Bước 1: Giải nén
            tar -xzf FFmpeg-Converter-Linux-x86_64-Portable.tar.gz
            cd FFmpeg-Converter/
            
            # Bước 2: Chạy!
            ./ffmpeg-converter
            ```
            
            **Cần cài dependencies (nếu chưa có):**
            ```bash
            # Ubuntu/Debian
            sudo apt-get install libgtk-3-0 libmpv1
            
            # Fedora
            sudo dnf install gtk3 mpv-libs
            
            # Arch Linux
            sudo pacman -S gtk3 mpv
            ```
            
            💡 **Tạo Desktop launcher:** Xem hướng dẫn trong `LINUX_README.txt`
            
            ---
            
            ### 🤖 Android - ✨ MỚI: Đã hỗ trợ chuyển đổi video!
            
            ```
            1. Tải file FFmpeg-Converter-Android.apk
            2. Mở file APK để cài đặt
            3. Cho phép "Install from unknown sources" nếu được hỏi
            4. Mở app và bắt đầu chuyển đổi video!
            ```
            
            🎉 **Tin vui:** Phiên bản Android **ĐÃ HỖ TRỢ ĐẦY ĐỦ** chuyển đổi video!
            
            **Tính năng:**
            - ✅ Chuyển đổi video trực tiếp trên Android
            - ✅ Hỗ trợ H.264, H.265, VP9, AV1 codecs
            - ✅ Điều chỉnh bitrate, resolution, CRF
            - ✅ Xem progress bar real-time
            - ✅ MIỄN PHÍ, KHÔNG QUẢNG CÁO
            
            **Yêu cầu:** Android 7.0 (API 24) trở lên
            
            ---
            
            ### ✨ Tính năng:
            
            - ✅ Chuyển đổi video sang MP4, WebM, AVI, MKV, MOV...
            - ✅ Điều chỉnh codec (H.264, H.265, VP9...)
            - ✅ Thay đổi bitrate, độ phân giải
            - ✅ Xem trước video trước/sau chuyển đổi
            - ✅ Giao diện thân thiện, dễ dùng
            - ✅ Đa ngôn ngữ: 🇬🇧 English | 🇻🇳 Tiếng Việt | 🇯🇵 日本語 | 🇩🇪 Deutsch
            
            ---
            
            ### 🌐 Dùng ngay trên Web - Không cần tải!
            
            Truy cập: **[https://ateliermizumi.github.io/FFmpeg-Converter-App/](https://ateliermizumi.github.io/FFmpeg-Converter-App/)**
            
            - ✅ Không cần cài đặt
            - ✅ Chạy trên mọi hệ điều hành (Windows, Mac, Linux, Android, iOS)
            - ✅ Tất cả xử lý diễn ra trên máy bạn (privacy-first)
            
            ---
            
            ### 📊 So sánh các phiên bản:
            
            | Tính năng | Windows | Linux | Android | Web |
            |-----------|---------|-------|---------|-----|
            | Chuyển đổi video | ✅ | ✅ | ✅ | ✅ |
            | Portable/No install | ✅ | ✅ | ❌ | ✅ |
            | Tốc độ | ⚡⚡⚡ | ⚡⚡⚡ | ⚡⚡ | ⚡⚡ |
            | Video preview | ✅ | ✅ | ✅ | ✅ |
            | Miễn phí, không quảng cáo | ✅ | ✅ | ✅ | ✅ |
            
            ---
            
            **🎉 Khuyến nghị:** 
            - Desktop users: Tải Windows/Linux portable - Hiệu suất tốt nhất ⚡
            - Mobile users: Tải Android APK - Chuyển đổi video trực tiếp trên điện thoại! 📱
            - Dùng thử nhanh: Dùng Web version - Không cần cài đặt
            
            **🌟 ĐẶC BIỆT:** Android version là công cụ chuyển đổi video MIỄN PHÍ, KHÔNG QUẢNG CÁO hiếm hoi trên thị trường!
            
            **Built with:** Flutter 💙 | **Build date:** ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
          files: |
            FFmpeg-Converter-Linux-x86_64-Portable.tar.gz
            LINUX_README.txt
            FFmpeg-Converter-Windows-Portable.zip
            FFmpeg-Converter-Android.apk
            app-release.apk
